<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pip SDK simulation lab</title><style>body{font:14px system-ui;color:#2d4753;background:#bdcdc9;margin:16px}button{padding:10px;margin:3px}iframe{width:390px;height:844px;max-width:100%;border:2px solid #527d79}pre{white-space:pre-wrap;font-size:11px;max-height:160px;overflow:auto}</style><h1>Pip SDK simulation lab</h1><p>Development simulation. Not YouTube certification.</p><button id="pause">Host pause</button><button id="resume">Host resume</button><button id="audio">Toggle host audio</button><button id="reload">Reload game</button><button id="fail">Toggle load failure</button><pre id="events" role="status"></pre><iframe id="gameFrame" src="mock-sandbox.html" title="Simulated Playables game"></iframe><script>window.PipLab={record:'',audio:true,lang:'en-US',fail:false};const frame=document.getElementById('gameFrame'),events=document.getElementById('events');function cmd(command){frame.contentWindow.postMessage({command},location.origin);}document.getElementById('pause').onclick=()=>cmd('pause');document.getElementById('resume').onclick=()=>cmd('resume');document.getElementById('audio').onclick=()=>{PipLab.audio=!PipLab.audio;cmd('audio');};document.getElementById('reload').onclick=()=>frame.src='mock-sandbox.html';document.getElementById('fail').onclick=()=>{PipLab.fail=!PipLab.fail;events.textContent+='\nload failure: '+PipLab.fail;};addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.pipLab)events.textContent+='\n'+e.data.type+(e.data.data?' '+JSON.stringify(e.data.data):'');});</script></html>
